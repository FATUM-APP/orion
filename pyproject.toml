[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-agent"
version = "0.2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "deepagents==0.7.0",
    "langgraph>=1.0.0,<2.0",
    "langchain>=1.0.0,<2.0",
    "langchain-core>=1.3.3,<2.0",
    "langgraph-cli[inmem]>=0.4.0",
    "python-dotenv",
    "langsmith[sandbox]>=0.14.14,<0.15",
    "langchain-anthropic",
    "langchain-openai",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "langchain-ollama>=1.1.0",
    "langchain-google-genai>=4.5.0",
]
[project.optional-dependencies]
google = ["langchain-google-genai"]

[tool.setuptools]
py-modules = ["models", "tracing"]
packages = ["tools", "auth", "context"]

[tool.ruff]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["T201", "E501", "UP006", "UP007", "E402"]
